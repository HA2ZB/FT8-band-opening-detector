# ============================================================
# FT8 Watcher configuration for WSJT-X UDP monitoring
# ============================================================
#
# This configuration is used by ft8watch_udp.py to:
#  - classify FT8 decodes as DX / non-DX
#  - drive a GPIO LED (DX open / standby heartbeat)
#  - log DX events into a CSV file
#
# The blacklist logic is PREFIX-based:
#   - prefixes listed here are considered "nearby / NOT DX"
#   - anything NOT matching these prefixes is treated as DX
#
# IMPORTANT:
#   Prefix matching is a simple string match:
#     callsign.startswith(prefix)
#
# ============================================================


ft8:
  # ----------------------------------------------------------
  # If true:
  #   only CQ messages ("CQ ...") are considered as DX candidates.
  #
  # If false:
  #   all decoded FT8 messages are considered (CQ + QSOs).
  # ----------------------------------------------------------
  only_cq: false

  # ----------------------------------------------------------
  # Prefix blacklist = nearby stations (NOT DX)
  #
  # This list is optimized for a ~1000 km radius around Hungary.
  #
  # Countries intentionally NOT listed here (therefore treated
  # as DX) include:
  #   - United Kingdom (G, M, 2*)
  #   - Spain (EA, EB, EC...)
  #   - Portugal (CT)
  #   - Azores (CU)
  #   - Madeira (CT3)
  #   - Canary Islands (EA8)
  #   - Italy (I*, IS0, IT9)
  #   - Greece (SV*)
  #
  # Add or remove prefixes carefully. Avoid overly generic
  # prefixes (e.g. "D"), which would match unrelated DXCCs.
  # ----------------------------------------------------------
  blacklist_prefixes:

    # --- Hungary ---
    - HA
    - HG

    # --- Slovakia / Czech Republic ---
    - OM
    - OK
    - OL

    # --- Austria ---
    - OE

    # --- Poland (FULL coverage, including contest/special calls) ---
    - SP
    - SN
    - SO
    - SQ
    - SR
    - HF
    - 3Z

    # --- Germany (explicit list, NOT "D") ---
    - DA
    - DB
    - DC
    - DD
    - DE
    - DF
    - DG
    - DH
    - DJ
    - DK
    - DL
    - DM
    - DN
    - DO
    - DP
    - DQ
    - DR

    # --- Switzerland / Liechtenstein ---
    - HB
    - HB0

    # --- Slovenia / Croatia ---
    - S5
    - 9A

    # --- Balkan region ---
    - E7     # Bosnia-Herzegovina
    - 4O     # Montenegro
    - YU     # Serbia
    - YT
    - Z3     # North Macedonia
    - Z6     # Kosovo
    - ZA     # Albania

    # --- Romania ---
    - YO
    - YP
    - YR

    # --- Bulgaria ---
    - LZ

    # --- European Russia (optional; remove if you want them as DX) ---
    - UA
    - UE
    - UA2     # Kaliningrad


# ============================================================
# LED behavior and CSV logging
# ============================================================

alert:
  # ----------------------------------------------------------
  # How long (in minutes) the LED stays ON after the last
  # detected DX station.
  # ----------------------------------------------------------
  dx_hold_minutes: 20

  # ----------------------------------------------------------
  # Standby heartbeat timing (when no DX is active):
  #
  # Every heartbeat_every_seconds:
  #   LED turns ON for heartbeat_on_seconds, then OFF again.
  # ----------------------------------------------------------
  heartbeat_every_seconds: 5
  heartbeat_on_seconds: 0.2

  # ----------------------------------------------------------
  # CSV log file path.
  #
  # Each DX event is appended as one line with:
  #   timestamp_utc, freq_hz, sender_callsign, grid, snr, raw_line
  #
  # Note: "snr" is currently reserved and left empty.
  # ----------------------------------------------------------
  csv_path: "/home/orangepi/FT8/dx_log.csv"


# ============================================================
# GPIO configuration for the LED
# ============================================================

gpio:
  # ----------------------------------------------------------
  # GPIO chip index:
  #   /dev/gpiochip1  -> chip: 1
  # ----------------------------------------------------------
  chip: 1

  # ----------------------------------------------------------
  # Allwinner-style GPIO port name.
  #
  # Format:
  #   P<Bank><Pin>
  # Example:
  #   PI6  -> bank I, pin 6
  #
  # The script converts this internally to a gpiod line number.
  # ----------------------------------------------------------
  port: "PI6"

  # ----------------------------------------------------------
  # LED electrical polarity:
  #
  # true  -> LED turns ON when GPIO is HIGH
  # false -> LED turns ON when GPIO is LOW
  # ----------------------------------------------------------
  active_high: true


# ============================================================
# WSJT-X UDP input settings
# ============================================================

wsjtx_udp:
  # ----------------------------------------------------------
  # IP address to bind the UDP socket.
  #
  # "0.0.0.0"   -> listen on all interfaces
  # "127.0.0.1" -> listen only on localhost (recommended if
  #                WSJT-X runs on the same machine)
  # ----------------------------------------------------------
  bind_ip: "0.0.0.0"

  # ----------------------------------------------------------
  # UDP port used by WSJT-X for broadcast messages.
  #
  # This must match the value configured in WSJT-X:
  #   Settings → Reporting → UDP Server
  # ----------------------------------------------------------
  port: 2237
